<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99999;justify-content:center;align-items:center" onclick="this.style.display='none'">
<img id="lightbox-img" style="max-width:90%;max-height:90%;border-radius:20px">
</div>

<script>
function openLightbox(src){
document.getElementById('lightbox').style.display='flex';
document.getElementById('lightbox-img').src=src;
}

function updateOpenStatus(){
const nzTime = new Date().toLocaleString("en-NZ",{timeZone:"Pacific/Auckland"});
const now = new Date(nzTime);
const hour = now.getHours();

const open = hour >= 7 && hour < 17;

document.getElementById("status-text").innerHTML =
open ? "🟢 Open Now" : "🔴 Closed Now";
}

updateOpenStatus();
</script>
